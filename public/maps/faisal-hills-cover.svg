<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="50%" stop-color="#0B1320" />
      <stop offset="100%" stop-color="#141E30" />
    </linearGradient>

    <!-- Blueprint Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4"/>
    </pattern>

    <!-- Radial Accent -->
    <radialGradient id="radialBlue" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#1E40AF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B1320" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />
  <rect width="1200" height="800" fill="url(#grid)" />
  <rect width="1200" height="800" fill="url(#radialBlue)" />

  <!-- Outer Technical Blueprint Border -->
  <rect x="30" y="30" width="1140" height="740" fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.5" rx="16" />
  <rect x="42" y="42" width="1116" height="716" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="8,8" stroke-opacity="0.4" rx="12" />

  <!-- Corner Alignment Crosshairs -->
  <g stroke="#60A5FA" stroke-width="1.5" stroke-opacity="0.8">
    <line x1="20" y1="30" x2="45" y2="30" /><line x1="30" y1="20" x2="30" y2="45" />
    <line x1="1155" y1="30" x2="1180" y2="30" /><line x1="1170" y1="20" x2="1170" y2="45" />
    <line x1="20" y1="770" x2="45" y2="770" /><line x1="30" y1="755" x2="30" y2="780" />
    <line x1="1155" y1="770" x2="1180" y2="770" /><line x1="1170" y1="755" x2="1170" y2="780" />
  </g>

  <!-- Architectural Sector Layout Demarcations -->
  <g fill="none" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.45">
    <!-- Main Boulevard Avenue -->
    <path d="M 120 480 Q 380 320, 600 360 T 1080 240" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 120 480 Q 380 320, 600 360 T 1080 240" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="16,12" stroke-linecap="round"/>

    <!-- Sector A & B Polygons -->
    <polygon points="180,160 420,130 460,300 220,330" fill="#1E3A8A" fill-opacity="0.2" stroke="#60A5FA" stroke-width="2" />
    <polygon points="460,120 740,90 780,260 500,290" fill="#1E3A8A" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2" />

    <!-- Executive Block Polygon -->
    <polygon points="780,90 1060,80 1040,240 820,250" fill="#2563EB" fill-opacity="0.25" stroke="#93C5FD" stroke-width="2.5" />

    <!-- Sector C & D Polygons -->
    <polygon points="160,370 440,350 420,560 140,580" fill="#1E293B" fill-opacity="0.4" stroke="#64748B" stroke-width="1.5" />
    <polygon points="480,380 780,390 760,620 460,600" fill="#1E3A8A" fill-opacity="0.2" stroke="#3B82F6" stroke-width="2" />
    <polygon points="820,330 1060,290 1030,520 800,560" fill="#1E3A8A" fill-opacity="0.15" stroke="#60A5FA" stroke-width="2" />
  </g>

  <!-- Sector Labels -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="800" text-anchor="middle" fill="#FFFFFF">
    <text x="320" y="235" font-size="22" letter-spacing="4" fill="#93C5FD">SECTOR A</text>
    <text x="620" y="195" font-size="22" letter-spacing="4" fill="#93C5FD">SECTOR B</text>
    <text x="930" y="170" font-size="24" letter-spacing="4" fill="#FFFFFF" font-weight="900">EXECUTIVE BLOCK</text>
    <text x="290" y="475" font-size="22" letter-spacing="4" fill="#94A3B8">SECTOR C</text>
    <text x="620" y="510" font-size="22" letter-spacing="4" fill="#93C5FD">SECTOR D</text>
    <text x="930" y="435" font-size="22" letter-spacing="4" fill="#93C5FD">OVERSEAS BLOCK</text>
  </g>

  <!-- Compass Rose (Top Right) -->
  <g transform="translate(1080, 110)">
    <circle cx="0" cy="0" r="32" fill="#0B1320" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.7"/>
    <polygon points="0,-28 7,-4 0,0 -7,-4" fill="#60A5FA" />
    <polygon points="0,28 7,4 0,0 -7,4" fill="#334155" />
    <polygon points="-28,0 -4,7 0,0 -4,-7" fill="#334155" />
    <polygon points="28,0 4,7 0,0 4,-7" fill="#334155" />
    <text x="0" y="-36" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">N</text>
  </g>

  <!-- Center Master Title Card -->
  <g transform="translate(600, 680)">
    <rect x="-380" y="-45" width="760" height="90" rx="18" fill="#070D18" fill-opacity="0.95" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
    <text x="0" y="-12" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="6" fill="#60A5FA" text-anchor="middle">OFFICIAL APPROVED MASTER PLAN (2024)</text>
    <text x="0" y="24" font-family="Georgia, serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle">FAISAL HILLS ISLAMABAD</text>
  </g>

  <!-- Verified Stamp Badge -->
  <g transform="translate(140, 110)">
    <rect x="0" y="0" width="160" height="38" rx="8" fill="#2563EB" fill-opacity="0.3" stroke="#60A5FA" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#60A5FA" />
    <text x="36" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="2">VERIFIED PDF</text>
  </g>
</svg>
